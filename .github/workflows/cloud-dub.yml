name: Cloud Dub

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Public YouTube URL
        required: true
        type: string
      target_language:
        description: Target language
        required: true
        default: Persian (فارسی)
        type: string
      primary_voice:
        description: Primary Gemini TTS voice
        required: true
        default: Kore
        type: choice
        options:
          - Kore
          - Puck
          - Charon
          - Zephyr
          - Fenrir
          - Leda
          - Orus
          - Aoede
          - Callirrhoe
          - Autonoe
          - Enceladus
          - Iapetus
          - Umbriel
          - Algieba
          - Despina
          - Erinome
          - Algenib
          - Rasalgethi
          - Laomedeia
          - Achernar
          - Alnilam
          - Schedar
          - Gacrux
          - Pulcherrima
          - Achird
          - Zubenelgenubi
          - Vindemiatrix
          - Sadachbia
          - Sadaltager
          - Sulafat
      secondary_voice:
        description: Second voice (choose Same for one voice)
        required: true
        default: Same
        type: choice
        options:
          - Same
          - Kore
          - Puck
          - Charon
          - Zephyr
          - Fenrir
          - Leda
          - Orus
          - Aoede
          - Callirrhoe
          - Autonoe
          - Enceladus
          - Iapetus
          - Umbriel
          - Algieba
          - Despina
          - Erinome
          - Algenib
          - Rasalgethi
          - Laomedeia
          - Achernar
          - Alnilam
          - Schedar
          - Gacrux
          - Pulcherrima
          - Achird
          - Zubenelgenubi
          - Vindemiatrix
          - Sadachbia
          - Sadaltager
          - Sulafat
      chunk_seconds:
        description: Smart Chunk size
        required: true
        default: '60'
        type: choice
        options:
          - '60'
          - '45'
          - '30'
          - '0'
      original_audio_percent:
        description: Original soundtrack under dub (0-100)
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-dub-${{ github.actor }}
  cancel-in-progress: false

jobs:
  dub:
    name: Dub video on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DUBBER_CACHE_DIR: .tts-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing."
            echo "Open Settings > Secrets and variables > Actions and create GEMINI_API_KEY."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore reusable TTS cache
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: gemini-tts-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            gemini-tts-${{ github.repository_id }}-

      - name: Run Smart Chunk cloud dubbing
        shell: bash
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          TARGET_LANGUAGE: ${{ inputs.target_language }}
          PRIMARY_VOICE: ${{ inputs.primary_voice }}
          SECONDARY_VOICE: ${{ inputs.secondary_voice }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
          ORIGINAL_AUDIO_PERCENT: ${{ inputs.original_audio_percent }}
        run: |
          SECONDARY_ARG=""
          if [ "$SECONDARY_VOICE" != "Same" ]; then
            SECONDARY_ARG="--secondary-voice $SECONDARY_VOICE"
          fi
          python cli.py \
            --youtube-url "$YOUTUBE_URL" \
            --target-language "$TARGET_LANGUAGE" \
            --primary-voice "$PRIMARY_VOICE" \
            $SECONDARY_ARG \
            --chunk-seconds "$CHUNK_SECONDS" \
            --chunk-max-gap 2.0 \
            --tts-rpm 3 \
            --original-audio-percent "$ORIGINAL_AUDIO_PERCENT" \
            --output-root cloud-output

      - name: Upload dubbed MP4, subtitles and transcript
        uses: actions/upload-artifact@v7
        with:
          name: dubbed-video-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: error
          retention-days: 2
