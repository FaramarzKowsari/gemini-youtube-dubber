name: Cloud Dub

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Public YouTube URL
        required: true
        type: string
      target_language:
        description: Target language
        required: true
        default: Persian (فارسی)
        type: string
      primary_voice:
        description: Primary Gemini TTS voice
        required: true
        default: Kore
        type: choice
        options: [Kore, Puck, Charon, Zephyr, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat]
      secondary_voice:
        description: Second voice (choose Same for one voice)
        required: true
        default: Same
        type: choice
        options: [Same, Kore, Puck, Charon, Zephyr, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat]
      chunk_seconds:
        description: Smart Chunk size
        required: true
        default: '60'
        type: choice
        options: ['60', '45', '30', '0']
      original_audio_percent:
        description: Original soundtrack under dub (mixed locally during finalization)
        required: true
        default: '0'
        type: string

  # Temporary self-test trigger. It runs only when the pushed commit message
  # contains [cloud-test], so ordinary pushes do not consume Gemini quota.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-dub-${{ github.actor }}
  cancel-in-progress: false

jobs:
  dub:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[cloud-test]')
    name: Generate dub audio on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DUBBER_CACHE_DIR: .tts-cache

      # GenerateContent is more compatible with API-key projects for this
      # YouTube workload than background Interaction retrieval.
      GEMINI_TRANSCRIBE_MODEL: gemini-3.6-flash
      GEMINI_TRANSCRIBE_FALLBACK_MODELS: gemini-3.5-flash,gemini-3.7-flash
      GEMINI_HTTP_TIMEOUT_MS: '180000'
      GEMINI_TRANSCRIBE_MAX_RETRIES: '1'
      GEMINI_TTS_MAX_RETRIES: '4'
      GEMINI_REUSE_TRANSCRIPT_CHECKPOINT: '1'

      # workflow_dispatch values; for our one-time [cloud-test] push these
      # fall back to the same short test video already used in previous runs.
      YOUTUBE_URL: ${{ inputs.youtube_url || 'https://www.youtube.com/watch?v=B_-Y95shNyA' }}
      TARGET_LANGUAGE: ${{ inputs.target_language || 'Persian (فارسی)' }}
      PRIMARY_VOICE: ${{ inputs.primary_voice || 'Kore' }}
      SECONDARY_VOICE: ${{ inputs.secondary_voice || 'Same' }}
      CHUNK_SECONDS: ${{ inputs.chunk_seconds || '60' }}
      ORIGINAL_AUDIO_PERCENT: ${{ inputs.original_audio_percent || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            dubber/gemini_client.py \
            dubber/cloud_pipeline.py \
            cloud_cli.py

      - name: Restore reusable TTS cache
        uses: actions/cache@v5
        with:
          path: .tts-cache
          key: gemini-tts-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            gemini-tts-${{ github.repository_id }}-

      - name: Generate Smart Chunk dubbing package
        shell: bash
        run: |
          set +e

          SECONDARY_ARG=""
          if [ "$SECONDARY_VOICE" != "Same" ]; then
            SECONDARY_ARG="--secondary-voice $SECONDARY_VOICE"
          fi

          LAST_STATUS=1

          for ATTEMPT in 1 2; do
            echo "============================================================"
            echo "Cloud Dub v0.2.5 process attempt ${ATTEMPT}/2"
            echo "Video analysis API: GenerateContent"
            echo "Primary analysis model: $GEMINI_TRANSCRIBE_MODEL"
            echo "Transcript checkpoint reuse: enabled"
            echo "============================================================"

            python cloud_cli.py \
              --youtube-url "$YOUTUBE_URL" \
              --target-language "$TARGET_LANGUAGE" \
              --primary-voice "$PRIMARY_VOICE" \
              $SECONDARY_ARG \
              --chunk-seconds "$CHUNK_SECONDS" \
              --chunk-max-gap 2.0 \
              --tts-rpm 3 \
              --original-audio-percent "$ORIGINAL_AUDIO_PERCENT" \
              --output-root cloud-output

            LAST_STATUS=$?

            if [ "$LAST_STATUS" -eq 0 ]; then
              exit 0
            fi

            if [ "$ATTEMPT" -lt 2 ]; then
              echo "::warning::Process failed with code ${LAST_STATUS}; retrying in 15s. If transcript.json exists, analysis will be skipped."
              sleep 15
            fi
          done

          echo "::error::Cloud Dub failed after 2 bounded process attempts."
          exit "$LAST_STATUS"

      - name: Upload checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-dub-checkpoint-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload dub audio package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-dub-package-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: error
          retention-days: 2

      - name: Finalization instructions
        if: success()
        shell: bash
        run: |
          {
            echo "## Cloud dub package is ready"
            echo ""
            echo "Download the cloud-dub-package artifact."
            echo "Then run FINALIZE_CLOUD_DUB_WINDOWS.bat on Windows."
          } >> "$GITHUB_STEP_SUMMARY"
