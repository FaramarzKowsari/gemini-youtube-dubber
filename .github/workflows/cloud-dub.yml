name: Cloud Dub

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Public YouTube URL
        required: true
        type: string
      target_language:
        description: Target language
        required: true
        default: Persian (فارسی)
        type: string
      primary_voice:
        description: Primary Gemini TTS voice
        required: true
        default: Kore
        type: choice
        options: [Kore, Puck, Charon, Zephyr, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat]
      secondary_voice:
        description: Second voice (choose Same for one voice)
        required: true
        default: Same
        type: choice
        options: [Same, Kore, Puck, Charon, Zephyr, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat]
      chunk_seconds:
        description: Smart Chunk size
        required: true
        default: '60'
        type: choice
        options: ['60', '45', '30', '0']
      original_audio_percent:
        description: Original soundtrack under dub (mixed locally during finalization)
        required: true
        default: '0'
        type: string

  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-dub-${{ github.actor }}
  cancel-in-progress: false

jobs:
  dub:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[cloud-test]')
    name: Generate dub audio on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DUBBER_CACHE_DIR: .tts-cache

      GEMINI_TRANSCRIBE_MODEL: gemini-2.5-flash
      GEMINI_TRANSCRIBE_FALLBACK_MODELS: gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash-lite,gemini-3.7-flash
      GEMINI_HTTP_TIMEOUT_MS: '120000'
      GEMINI_TRANSCRIBE_MAX_RETRIES: '0'

      # Reserve preferred TTS quota for measured timing correction passes.
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_FALLBACK_MODELS: gemini-2.5-flash-preview-tts
      GEMINI_TTS_REQUEST_BUDGET: '4'
      GEMINI_TTS_MAX_RETRIES: '0'
      DUB_TTS_FALLBACK_ENGINE: edge

      # v0.3.6 exact sync: neutral Edge speech is generated one segment at a time.
      DUB_TTS_PRIMARY_ENGINE: edge
      DUB_SYNC_MODE: segment_locked
      DUB_SYNC_MAX_SEGMENT_SECONDS: '8'
      DUB_SYNC_MAX_CHARS: '180'
      DUB_SYNC_MIN_SEGMENT_SECONDS: '2.5'
      DUB_SYNC_VAD_SNAP_SECONDS: '0.70'
      DUB_SYNC_MIN_PAUSE_SECONDS: '0.12'
      DUB_SYNC_MAX_SILENCE_BORROW_SECONDS: '1.50'

      # Edge deterministic timing overflow must escape immediately to AI timing
      # feedback. Only genuine Edge network/service failures are retried here.
      EDGE_TTS_MAX_RETRIES: '0'
      EDGE_TTS_NETWORK_RETRIES: '1'

      # Pre-TTS semantic timing adaptation. 0.80 substantially reduces the need
      # for post-TTS Gemini correction while keeping short faithful speech silent.
      DUB_TIMING_DIRECTOR: '1'
      DUB_TIMING_OCCUPANCY: '0.80'
      DUB_TIMING_BATCH_SIZE: '40'

      # Measured closed-loop timing: synthesize -> measure -> compress -> retry.
      # Keep the 1.10x natural-rate ceiling. Provider outages get a multi-minute
      # bounded retry window rather than killing a long dub after ~60 seconds.
      DUB_TIMING_MAX_SPEEDUP: '1.10'
      DUB_TIMING_EXPAND_BELOW: '0.80'
      DUB_TIMING_FEEDBACK_MAX_PASSES: '4'
      DUB_TIMING_AI_RETRY_ROUNDS: '5'
      DUB_TIMING_AI_RETRY_BASE_SECONDS: '60'

      GEMINI_REUSE_TRANSCRIPT_CHECKPOINT: '1'

      YOUTUBE_URL: ${{ github.event.inputs.youtube_url || 'https://www.youtube.com/watch?v=B_-Y95shNyA' }}
      TARGET_LANGUAGE: ${{ github.event.inputs.target_language || 'Persian (فارسی)' }}
      PRIMARY_VOICE: ${{ github.event.inputs.primary_voice || 'Kore' }}
      SECONDARY_VOICE: ${{ github.event.inputs.secondary_voice || 'Same' }}
      CHUNK_SECONDS: ${{ github.event.inputs.chunk_seconds || '60' }}
      ORIGINAL_AUDIO_PERCENT: ${{ github.event.inputs.original_audio_percent || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            dubber/gemini_client.py \
            dubber/fallback_tts.py \
            dubber/tts_orchestrator.py \
            dubber/timing_audio.py \
            dubber/timing_director.py \
            dubber/timing_feedback.py \
            dubber/sync_timeline.py \
            dubber/cloud_pipeline.py \
            scripts/preseed_checkpoint.py \
            cloud_cli.py

      - name: Restore reusable speech and transcript cache
        id: dub-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            .tts-cache
            cloud-output/checkpoints
          key: gemini-dub-v3-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            gemini-dub-v3-${{ github.repository_id }}-

      - name: Recover matching transcript from prior successful artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p .prior-cloud-dubs

          # A real cache checkpoint wins immediately.
          python scripts/preseed_checkpoint.py \
            --youtube-url "$YOUTUBE_URL" \
            --target-language "$TARGET_LANGUAGE" \
            --search-root cloud-output \
            --output-root cloud-output
          if [ "$?" -eq 0 ]; then
            echo "A matching checkpoint is already available; prior artifacts are not needed."
            exit 0
          fi

          FOUND=0
          while read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            rm -rf .prior-cloud-dubs/*
            echo "Checking successful Cloud Dub run $RUN_ID for a reusable base transcript..."
            gh run download "$RUN_ID" \
              --pattern 'cloud-dub-package-*' \
              --dir .prior-cloud-dubs >/dev/null 2>&1 || continue

            python scripts/preseed_checkpoint.py \
              --youtube-url "$YOUTUBE_URL" \
              --target-language "$TARGET_LANGUAGE" \
              --search-root .prior-cloud-dubs \
              --output-root cloud-output
            if [ "$?" -eq 0 ]; then
              FOUND=1
              echo "Recovered matching transcript from successful run $RUN_ID."
              break
            fi
          done < <(
            gh run list \
              --workflow cloud-dub.yml \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId' 2>/dev/null
          )

          rm -rf .prior-cloud-dubs
          if [ "$FOUND" -eq 0 ]; then
            echo "No matching prior transcript artifact found; resilient Gemini analysis will run."
          fi
          exit 0

      - name: Generate hybrid dubbing package
        shell: bash
        run: |
          set +e

          SECONDARY_ARG=""
          if [ "$SECONDARY_VOICE" != "Same" ]; then
            SECONDARY_ARG="--secondary-voice $SECONDARY_VOICE"
          fi

          LAST_STATUS=1

          for ATTEMPT in 1; do
            echo "============================================================"
            echo "Gemini YouTube Dubber v0.5.0 · attempt ${ATTEMPT}/1"
            echo "Analysis/translation: Gemini GenerateContent"
            echo "Precision speech: onset-locked Edge TTS with real-silence deadline borrowing"
            echo "Automatic speech fallback: Edge Neural TTS"
            echo "Measured timing feedback: ON"
            echo "Exact Edge timing guard -> AI text repair: ON"
            echo "Natural speech hard limit: ${DUB_TIMING_MAX_SPEEDUP}x"
            echo "Max AI timing feedback passes: $DUB_TIMING_FEEDBACK_MAX_PASSES"
            echo "Gemini preferred request budget: $GEMINI_TTS_REQUEST_BUDGET"
            echo "============================================================"

            python cloud_cli.py \
              --youtube-url "$YOUTUBE_URL" \
              --target-language "$TARGET_LANGUAGE" \
              --primary-voice "$PRIMARY_VOICE" \
              $SECONDARY_ARG \
              --chunk-seconds "$CHUNK_SECONDS" \
              --chunk-max-gap 2.0 \
              --tts-rpm 3 \
              --fallback-tts edge \
              --original-audio-percent "$ORIGINAL_AUDIO_PERCENT" \
              --output-root cloud-output

            LAST_STATUS=$?

            if [ "$LAST_STATUS" -eq 0 ]; then
              exit 0
            fi

            if [ "$ATTEMPT" -lt 1 ]; then
              echo "::warning::Attempt failed with code ${LAST_STATUS}; retrying in 10s. Matching transcript and speech cache will be reused."
              sleep 10
            fi
          done

          echo "::error::Cloud Dub failed after its bounded process attempt."
          exit "$LAST_STATUS"

      - name: Save reusable speech and transcript cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .tts-cache
            cloud-output/checkpoints
          key: gemini-dub-v3-${{ github.repository_id }}-${{ github.run_id }}

      - name: Upload checkpoint on failure or cancellation
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cloud-dub-checkpoint-${{ github.run_number }}
          path: |
            cloud-output/output/
            cloud-output/checkpoints/
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload dub audio package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-dub-package-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: error
          retention-days: 2

      - name: Finalization instructions
        if: success()
        shell: bash
        run: |
          {
            echo "## Cloud dub package is ready"
            echo ""
            echo "v0.5.0 uses semantic source timing units, no per-segment padding, and bounded transient Gemini retries."
            echo "Overlong speech is rewritten and re-synthesized instead of being rushed."
            echo "Short speech is accepted unchanged; the master timeline supplies silence."
            echo "Recovered transcripts now use the same fingerprint as the main pipeline."
            echo "See timing_feedback.json for per-chunk measurements."
            echo ""
            echo "Download the cloud-dub-package artifact."
            echo "Then run FINALIZE_CLOUD_DUB_WINDOWS.bat on Windows."
          } >> "$GITHUB_STEP_SUMMARY"
