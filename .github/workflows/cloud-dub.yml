name: Cloud Dub

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Public YouTube URL
        required: true
        type: string
      target_language:
        description: Target language
        required: true
        default: Persian (فارسی)
        type: string
      primary_voice:
        description: Primary Gemini TTS voice
        required: true
        default: Kore
        type: choice
        options: [Kore, Puck, Charon, Zephyr, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat]
      secondary_voice:
        description: Second voice (choose Same for one voice)
        required: true
        default: Same
        type: choice
        options: [Same, Kore, Puck, Charon, Zephyr, Fenrir, Leda, Orus, Aoede, Callirrhoe, Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome, Algenib, Rasalgethi, Laomedeia, Achernar, Alnilam, Schedar, Gacrux, Pulcherrima, Achird, Zubenelgenubi, Vindemiatrix, Sadachbia, Sadaltager, Sulafat]
      chunk_seconds:
        description: Smart Chunk size
        required: true
        default: '60'
        type: choice
        options: ['60', '45', '30', '0']
      original_audio_percent:
        description: Original soundtrack under dub (mixed locally during finalization)
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-dub-${{ github.actor }}
  cancel-in-progress: false

jobs:
  dub:
    name: Generate dub audio on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DUBBER_CACHE_DIR: .tts-cache
      GEMINI_TRANSCRIBE_FALLBACK_MODELS: gemini-3.6-flash,gemini-3.5-flash
      GEMINI_TRANSCRIBE_TIMEOUT_SECONDS: '240'
      GEMINI_TRANSCRIBE_POLL_SECONDS: '5'
      GEMINI_HTTP_TIMEOUT_MS: '120000'
      GEMINI_TRANSCRIBE_MAX_RETRIES: '1'
      GEMINI_TTS_MAX_RETRIES: '4'
      GEMINI_REUSE_TRANSCRIPT_CHECKPOINT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore reusable TTS cache
        uses: actions/cache@v5
        with:
          path: .tts-cache
          key: gemini-tts-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            gemini-tts-${{ github.repository_id }}-

      - name: Generate Smart Chunk dubbing package
        shell: bash
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          TARGET_LANGUAGE: ${{ inputs.target_language }}
          PRIMARY_VOICE: ${{ inputs.primary_voice }}
          SECONDARY_VOICE: ${{ inputs.secondary_voice }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
          ORIGINAL_AUDIO_PERCENT: ${{ inputs.original_audio_percent }}
        run: |
          set +e

          SECONDARY_ARG=""
          if [ "$SECONDARY_VOICE" != "Same" ]; then
            SECONDARY_ARG="--secondary-voice $SECONDARY_VOICE"
          fi

          LAST_STATUS=1

          for ATTEMPT in 1 2; do
            echo "============================================================"
            echo "Cloud Dub process attempt ${ATTEMPT}/2"
            echo "Gemini Background Execution: enabled"
            echo "Analysis timeout: 240s per model"
            echo "Transcript checkpoint reuse: enabled"
            echo "============================================================"

            python cloud_cli.py \
              --youtube-url "$YOUTUBE_URL" \
              --target-language "$TARGET_LANGUAGE" \
              --primary-voice "$PRIMARY_VOICE" \
              $SECONDARY_ARG \
              --chunk-seconds "$CHUNK_SECONDS" \
              --chunk-max-gap 2.0 \
              --tts-rpm 3 \
              --original-audio-percent "$ORIGINAL_AUDIO_PERCENT" \
              --output-root cloud-output

            LAST_STATUS=$?

            if [ "$LAST_STATUS" -eq 0 ]; then
              exit 0
            fi

            if [ "$ATTEMPT" -lt 2 ]; then
              echo "::warning::Process failed with code ${LAST_STATUS}; retrying in 20s. If transcript.json exists, video analysis will be skipped."
              sleep 20
            fi
          done

          echo "::error::Cloud Dub failed after 2 bounded process attempts."
          exit "$LAST_STATUS"

      - name: Upload checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-dub-checkpoint-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload dub audio package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-dub-package-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: error
          retention-days: 2

      - name: Finalization instructions
        if: success()
        shell: bash
        run: |
          {
            echo "## Cloud dub package is ready"
            echo ""
            echo "1. Download the cloud-dub-package artifact."
            echo "2. Double-click FINALIZE_CLOUD_DUB_WINDOWS.bat on Windows."
            echo "3. Select the downloaded artifact ZIP."
          } >> "$GITHUB_STEP_SUMMARY"
