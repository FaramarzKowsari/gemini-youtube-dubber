name: Cloud Dub Semantic Lock

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Public YouTube URL
        required: true
        default: https://www.youtube.com/watch?v=B_-Y95shNyA
        type: string
      target_language:
        description: Target language
        required: true
        default: Persian (فارسی)
        type: string

  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-dub-semantic-lock-${{ github.actor }}
  cancel-in-progress: false

jobs:
  dub:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[semantic-test]')
    name: Generate semantic-locked dub audio
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_DUBBER_CACHE_DIR: .tts-cache

      GEMINI_TRANSCRIBE_MODEL: gemini-2.5-flash
      GEMINI_TRANSCRIBE_FALLBACK_MODELS: gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash-lite,gemini-3.7-flash
      GEMINI_HTTP_TIMEOUT_MS: '120000'
      GEMINI_TRANSCRIBE_MAX_RETRIES: '0'

      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_FALLBACK_MODELS: gemini-2.5-flash-preview-tts
      GEMINI_TTS_REQUEST_BUDGET: '4'
      GEMINI_TTS_MAX_RETRIES: '0'

      DUB_TTS_FALLBACK_ENGINE: edge
      DUB_TTS_PRIMARY_ENGINE: edge
      DUB_SYNC_MODE: segment_locked

      DUB_SYNC_MIN_PAUSE_SECONDS: '0.12'
      DUB_SYNC_MAX_SILENCE_BORROW_SECONDS: '1.50'

      EDGE_TTS_MAX_RETRIES: '0'
      EDGE_TTS_NETWORK_RETRIES: '1'

      DUB_TIMING_DIRECTOR: '1'
      DUB_TIMING_OCCUPANCY: '0.92'
      DUB_TIMING_BATCH_SIZE: '40'
      DUB_TIMING_MAX_SPEEDUP: '1.10'
      DUB_TIMING_EXPAND_BELOW: '0.80'
      DUB_TIMING_FEEDBACK_MAX_PASSES: '4'

      GEMINI_REUSE_TRANSCRIPT_CHECKPOINT: '1'

      YOUTUBE_URL: ${{ github.event.inputs.youtube_url || 'https://www.youtube.com/watch?v=B_-Y95shNyA' }}
      TARGET_LANGUAGE: ${{ github.event.inputs.target_language || 'Persian (فارسی)' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate Gemini secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate semantic-lock runner
        run: |
          python -m py_compile cloud_cli_semantic_lock.py
          python -m pytest -q \
            tests/test_semantic_lock_runner.py \
            tests/test_v040_real_silence_sync.py

      - name: Restore reusable speech and transcript cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .tts-cache
            cloud-output/checkpoints
          key: gemini-dub-v3-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            gemini-dub-v3-${{ github.repository_id }}-

      - name: Generate semantic-locked dubbing package
        shell: bash
        run: |
          echo "============================================================"
          echo "Gemini YouTube Dubber v0.4.2 Semantic-Locked Sync"
          echo "Artificial pre-TTS subdivision: DISABLED"
          echo "Zero-gap source continuations: MERGED"
          echo "Real-silence borrowing: ON"
          echo "Per-segment silence padding: OFF"
          echo "Natural speech hard limit: ${DUB_TIMING_MAX_SPEEDUP}x"
          echo "============================================================"

          python cloud_cli_semantic_lock.py \
            --youtube-url "$YOUTUBE_URL" \
            --target-language "$TARGET_LANGUAGE" \
            --primary-voice Kore \
            --chunk-seconds 60 \
            --chunk-max-gap 2.0 \
            --tts-rpm 3 \
            --fallback-tts edge \
            --original-audio-percent 0 \
            --output-root cloud-output

      - name: Save reusable speech and transcript cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            .tts-cache
            cloud-output/checkpoints
          key: gemini-dub-v3-${{ github.repository_id }}-${{ github.run_id }}

      - name: Upload checkpoint on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-lock-checkpoint-${{ github.run_number }}
          path: |
            cloud-output/output/
            cloud-output/checkpoints/
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload semantic-locked dub package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-lock-dub-package-${{ github.run_number }}
          path: cloud-output/output/
          if-no-files-found: error
          retention-days: 2
